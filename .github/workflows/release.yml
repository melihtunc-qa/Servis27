name: Release Servis27

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Desktop App (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}
          releaseName: 'Servis27 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.0' }}'
          releaseBody: 'Servis27 - Araç Bakım & Müşteri Takip Sistemi v1.5.0 Windows Kurulum ve Çalıştırılabilir (.exe) Paketi'
          releaseDraft: false
          prerelease: false
